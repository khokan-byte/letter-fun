<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FFD6E8">
<title>Letter Fun</title>
<style>
:root{--pink:#FFD6E8;--sky:#CBE8FF;--mint:#C8F0DC;--sun:#FFF3A3;--lav:#E3D6FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,Arial,sans-serif;background:linear-gradient(180deg,#FFEFF3,#E6F7FF 55%,#FFF9DC);color:#263238;overflow:hidden}
button{font-family:inherit;touch-action:manipulation;border:0;cursor:pointer;color:inherit}
#top{position:fixed;top:0;left:0;right:0;height:62px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;background:rgba(255,255,255,.93);border-bottom:3px solid var(--pink);z-index:30}
.tb{font-size:24px;background:#fff;border-radius:999px;padding:6px 14px;min-height:46px;min-width:46px;box-shadow:0 3px 0 #ddd}
#stars{font-weight:800;font-size:22px}
#app{position:absolute;top:62px;bottom:0;left:0;right:0;overflow-y:auto;overflow-x:hidden;padding:12px 12px 120px;max-width:900px;margin:0 auto}
.center{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.btn,.b{font-size:28px;background:#fff;border-radius:999px;padding:10px 22px;min-height:56px;min-width:56px;box-shadow:0 5px 0 #0002}
.btn.big{font-size:36px;background:#4EA8FF;color:#fff}
.btn.go{background:#5ECF8B;color:#fff}
.sel{background:#FFD93D}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
@media(min-width:700px){.menu{grid-template-columns:1fr 1fr 1fr}}
.mbtn{border-radius:26px;padding:12px 6px;font-size:24px;font-weight:800;min-height:120px;box-shadow:0 7px 0 #0002}
.mbtn span{display:block;font-size:52px}
.mb1{background:var(--pink)}.mb2{background:var(--sky)}.mb3{background:var(--mint)}.mb4{background:var(--sun)}.mb5{background:var(--lav)}
.cont{display:block;width:100%;margin:14px 0 4px;background:#5ECF8B;color:#fff;font-size:24px;font-weight:800;border-radius:26px;padding:16px;box-shadow:0 7px 0 #0002;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.hero{font-size:84px;display:inline-block;animation:bounce 1.8s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
#mas{position:fixed;left:8px;bottom:6px;z-index:40;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
#mem{font-size:56px;pointer-events:auto;cursor:pointer}
#mem.jump{animation:jump .6s}
@keyframes jump{40%{transform:translateY(-26px) scale(1.15)}}
#bub{background:#fff;border:3px solid var(--pink);border-radius:18px;padding:8px 14px;font-size:20px;font-weight:700;max-width:60vw;opacity:0;transform:scale(.8);transition:.25s;margin-bottom:14px}
#bub.show{opacity:1;transform:scale(1)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:22px;margin-bottom:6px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ddd;margin:0 3px}.dot.on{background:#5ECF8B}
.stage{text-align:center;min-height:300px}
.stage.pop{height:62vh;position:relative;overflow:hidden;background:linear-gradient(#BDEBFF,#FFF8D6);border-radius:24px}
.q{font-size:28px;font-weight:800;margin:6px 0}
.pic{font-size:min(26vw,140px);line-height:1.1}
.bigL{font-size:min(38vw,170px);font-weight:900;line-height:1.1}
.w{font-size:34px;font-weight:800}
.objs{max-width:640px;margin:8px auto;font-size:min(11vw,52px);line-height:1.25}
.opts{display:flex;gap:14px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.opt{min-width:min(28vw,150px);height:min(24vw,130px);font-size:min(13vw,62px);font-weight:900;border-radius:28px;color:#fff;box-shadow:0 8px 0 #0003;padding:0 10px}
.opt.good{outline:6px solid #5ECF8B}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.bal{position:absolute;bottom:-130px;width:96px;height:116px;border-radius:50% 50% 45% 45%;font-size:52px;font-weight:900;color:#fff;animation:up 8s linear forwards;box-shadow:inset -8px -8px #0002}
@keyframes up{to{transform:translateY(-140vh)}}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:520px;margin:12px auto}
.mc{height:min(30vw,150px);font-size:min(13vw,60px);border-radius:22px;background:#9B7BFF;color:#fff;box-shadow:0 6px 0 #0003}
.mc.up{background:#fff;color:#263238}.mc.ok{background:#C8F0DC}
.lcard{background:rgba(255,255,255,.9);border:4px solid #fff;border-radius:30px;padding:10px;text-align:center;box-shadow:0 10px 30px #0001}
.list{display:flex;flex-direction:column;gap:10px}
.lcrd{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border-radius:22px;padding:12px 14px;font-size:24px;font-weight:800;box-shadow:0 5px 0 #0002;text-align:left}
.lcrd.nxt{outline:5px solid #5ECF8B}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-style:normal;padding:4px 10px;border-radius:12px;font-size:26px;font-weight:800}
.m0{background:#eee}.m1{background:#FFF3A3}.m2{background:#FFD93D}.m3{background:#9BE7B5}
.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hd{width:100%;font-size:24px;font-weight:800;color:#e0457b;margin-top:8px}
.tile{position:relative;width:84px;height:84px;font-size:38px;font-weight:800;border-radius:18px;color:#fff;box-shadow:0 5px 0 #0003}
.tile i{position:absolute;top:2px;right:5px;font-size:16px;font-style:normal}
.meter{height:20px;background:#fff;border-radius:99px;max-width:360px;margin:8px auto;overflow:hidden;border:3px solid #FFD93D}.meter b{display:block;height:100%;background:#FFD93D}
.stk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:54px;max-width:420px;margin:10px auto}
.card{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50}
.cin{background:#fff;border-radius:32px;padding:18px 26px;max-width:94vw;max-height:94vh;overflow:auto;text-align:center}
.conf{position:fixed;top:-40px;font-size:28px;z-index:99;pointer-events:none;animation:fall 1.5s forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 18px;border-radius:16px;z-index:90;font-size:22px}
</style></head><body>
<div id="top"><button class="tb" id="bk" onclick="back()">⬅️</button><button class="tb" onclick="goHome()">🏠</button><span id="stars" class="tb">⭐ 0</span></div>
<div id="app"></div>
<div id="mas"><div id="mem" onclick="hello()">🦜</div><div id="bub"></div></div>
<script>
"use strict";
/* ============ CONTENT: edit here to match her school book ============
   Format per item:  letter|word|picture   (add |- if the word does NOT start with that letter)  */
const DATA={
en:[
["A – C","A|Apple|🍎;B|Ball|⚽;C|Cat|🐱"],["D – F","D|Dog|🐶;E|Elephant|🐘;F|Fish|🐟"],
["G – I","G|Grapes|🍇;H|Hat|🎩;I|Ice cream|🍦"],["J – L","J|Juice|🧃;K|Kite|🪁;L|Lion|🦁"],
["M – O","M|Moon|🌙;N|Nose|👃;O|Orange|🍊"],["P – R","P|Parrot|🦜;Q|Queen|👸;R|Rainbow|🌈"],
["S – U","S|Sun|☀️;T|Tree|🌳;U|Umbrella|☂️"],["V – X","V|Van|🚐;W|Watch|⌚;X|X-mas tree|🎄"],
["Y – Z","Y|Yo-yo|🪀;Z|Zebra|🦓"]],
bn:[
["স্বরবর্ণ ১","অ|অজগর|🐍;আ|আম|🥭;ই|ইঁদুর|🐭"],["স্বরবর্ণ ২","ঈ|ঈগল|🦅;উ|উট|🐪;ঊ|ঊষা|🌅"],
["স্বরবর্ণ ৩","ঋ|ঋষি|🧘;এ|এক|1️⃣;ঐ|ঐরাবত|🐘"],["স্বরবর্ণ ৪","ও|ওল|🥔;ঔ|ঔষধ|💊"],
["ব্যঞ্জনবর্ণ ১","ক|কলা|🍌;খ|খরগোশ|🐰;গ|গরু|🐄;ঘ|ঘড়ি|⏰;ঙ|ব্যাঙ|🐸|-"],
["ব্যঞ্জনবর্ণ ২","চ|চাঁদ|🌙;ছ|ছাগল|🐐;জ|জাহাজ|🚢;ঝ|ঝিনুক|🐚;ঞ|ইঞ্চি|📏|-"],
["ব্যঞ্জনবর্ণ ৩","ট|টিয়া|🦜;ঠ|ঠোঁট|👄;ড|ডিম|🥚;ঢ|ঢাক|🥁;ণ|ঘণ্টা|🔔|-"],
["ব্যঞ্জনবর্ণ ৪","ত|তারা|⭐;থ|থালা|🍽️;দ|দুধ|🥛;ধ|ধান|🌾;ন|নৌকা|⛵"],
["ব্যঞ্জনবর্ণ ৫","প|পাখি|🐦;ফ|ফুল|🌻;ব|বই|📖;ভ|ভাত|🍚;ম|মাছ|🐟"],
["ব্যঞ্জনবর্ণ ৬","য|যাদুকর|🧙;র|রাজা|🤴;ল|লেবু|🍋;শ|শাপলা|🌸💧"],
["ব্যঞ্জনবর্ণ ৭","ষ|ষাঁড়|🐂;স|সূর্য|☀️;হ|হাঁস|🦆"],
["বিশেষ বর্ণ ১","ড়|ঘুড়ি|🪁|-;ঢ়|আষাঢ়|🌧️|-;য়|ময়ূর|🦚|-"],
["বিশেষ বর্ণ ২","ৎ|বিদ্যুৎ|⚡|-;ং|রং|🎨|-;ঃ|দুঃখ|😢|-;ঁ|চাঁদ|🌙|-"]]};
const ENW=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty"];
const BNW=["","এক","দুই","তিন","চার","পাঁচ","ছয়","সাত","আট","নয়","দশ","এগারো","বারো","তেরো","চৌদ্দ","পনেরো","ষোল","সতেরো","আঠারো","উনিশ","বিশ"];
const PH=[["ok","Great job!","বাহ্! দারুণ!"],["ok2","Well done!","শাবাশ!"],["again","Try again","আবার চেষ্টা করো"],["hi","Hello!","হ্যালো!"],["done","All done! Star time!","সব শেষ! তারকা!"]];
const STR={
en:{letters:"Letters",numbers:"Numbers",games:"Games",trace:"Trace",rewards:"Rewards",next:"Next lesson",hi:"Hello",q_start:"Which letter does it start with?",q_find:"Find this letter",q_count:"How many?",q_listen:"Which one did you hear?",q_mem:"Find the pairs",well:"Well done",again:"Again",g_match:"Match",g_pop:"Pop",g_listen:"Listen",g_count:"Count",g_mem:"Memory",novoice:"Ask a grown-up to record voices (Parents ⚙️)",quiz:"Quiz"},
bn:{letters:"অক্ষর",numbers:"সংখ্যা",games:"খেলা",trace:"লেখো",rewards:"পুরস্কার",next:"পরের পাঠ",hi:"হ্যালো",q_start:"কোন অক্ষর দিয়ে শুরু?",q_find:"এই অক্ষরটি খোঁজো",q_count:"কয়টি?",q_listen:"কোনটি শুনলে?",q_mem:"জোড়া মেলাও",well:"শাবাশ",again:"আবার",g_match:"মেলাও",g_pop:"ফাটাও",g_listen:"শোনো",g_count:"গোনো",g_mem:"স্মৃতি",novoice:"বড়দের বলো: Parents ⚙️ থেকে ভয়েস রেকর্ড করতে",quiz:"কুইজ"}};
const OBJ=["🍎","⭐","🐟","🎈","🌸","🐥","🍓","🚗"];
const COL=["#ef476f","#f78c1f","#06a77d","#118ab2","#9b5de5","#e0457b"];
const STK=["🦄","🐼","🦋","🐠","🚀","🌟","🐯","🍭","🐬","🎠","🐢","🌈"];

/* ============ BASICS ============ */
const $=id=>document.getElementById(id),R=a=>a[Math.random()*a.length|0],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const h=(t,c,x,f)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.innerHTML=x;if(f)e.onclick=f;return e};
const bd=s=>String(s).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
let lang="en",hist=[],curF=null,iv=null,TO=[],RP=()=>{},REC={},BL={},au=null,mr=null,chunks=[],rk="",bubT=0,pgT=0,greeted=false;
const tx=k=>STR[lang][k];
let P={stars:0,done:{},st:{},m:{},tr:{},name:"",all:false,streak:0,lastDay:""};
try{Object.assign(P,JSON.parse(localStorage.lf3||"{}"))}catch(e){}
if(!localStorage.lf3&&+localStorage.stars)P.stars=+localStorage.stars;
const today=new Date().toDateString();
if(P.lastDay!=today){P.streak=(P.lastDay==new Date(Date.now()-864e5).toDateString())?(P.streak||0)+1:1;P.lastDay=today}
const save=()=>{try{localStorage.lf3=JSON.stringify(P)}catch(e){}};save();

/* build lessons for both languages */
function build(l){
 const out=DATA[l].map((d,i)=>({id:l+":L"+i,kind:"L",name:d[0],items:d[1].split(";").map(s=>{const p=s.split("|");return{lang:l,kind:"L",ch:p[0],word:p[1],pic:p[2],skip:p[3]=="-",k:l+":"+p[0]}})}));
 [[1,5],[6,10],[11,15],[16,20]].forEach((r,i)=>{const it=[];for(let n=r[0];n<=r[1];n++)it.push({lang:l,kind:"N",n,ch:l=="en"?""+n:bd(n),word:(l=="en"?ENW:BNW)[n],pic:OBJ[n%OBJ.length],k:l+":n"+n});out.push({id:l+":N"+i,kind:"N",name:it[0].ch+" – "+it[4].ch,items:it})});
 return out}
const LES={en:build("en"),bn:build("bn")};
const lessons=k=>LES[lang].filter(l=>l.kind==k),allItems=k=>lessons(k).flatMap(l=>l.items);
const disp=x=>x.ch;
const phItems=()=>PH.map(p=>({lang,kind:"P",ch:p[lang=="en"?1:2],word:p[lang=="en"?1:2],pic:"💬",k:lang+":p_"+p[0]}));
const nextLesson=()=>lessons("L").find(l=>!P.done[l.id])||lessons("N").find(l=>!P.done[l.id])||null;

/* ============ NAVIGATION ============ */
function clearAll(){clearInterval(iv);TO.forEach(clearTimeout);TO=[];document.querySelectorAll(".card").forEach(c=>c.remove());try{speechSynthesis.cancel()}catch(e){}if(au){au.pause();au=null}}
const later=(f,ms)=>{const id=setTimeout(()=>{TO=TO.filter(x=>x!=id);f()},ms);TO.push(id)};
function chrome(){$("bk").style.visibility=hist.length?"visible":"hidden";$("stars").textContent="⭐ "+P.stars}
function go(f){if(curF)hist.push(curF);curF=f;clearAll();f();chrome()}
function back(){clearAll();curF=hist.pop()||homeScreen;curF();chrome()}
function goHome(){hist=[];curF=homeScreen;clearAll();homeScreen();chrome()}
function scr(...n){const a=$("app");a.innerHTML="";a.scrollTop=0;n.forEach(x=>a.append(x))}
function toast(x){const t=h("div","toast",x);document.body.append(t);setTimeout(()=>t.remove(),2600)}
function confetti(){for(let i=0;i<18;i++){const s=h("div","conf",["⭐","🎉","🌈","💖","✨"][i%5]);s.style.left=Math.random()*90+"vw";s.style.animationDuration=(1.2+Math.random())+"s";document.body.append(s);setTimeout(()=>s.remove(),2600)}}
function mas(x){const b=$("bub");b.textContent=x;b.classList.add("show");clearTimeout(bubT);bubT=setTimeout(()=>b.classList.remove("show"),2800);$("mem").classList.add("jump");setTimeout(()=>$("mem").classList.remove("jump"),600)}
function hello(){mas(PH[3][lang=="en"?1:2]);sayP("hi")}
function addStar(n=1){const o=P.stars/10|0;P.stars+=n;save();chrome();const e=P.stars/10|0;if(e>o&&e<=STK.length){confetti();toast("🎁 "+STK[e-1])}}
function mark(x,ok){const m=P.m[x.k]||0;P.m[x.k]=ok?Math.min(3,m+1):Math.max(0,m-1);save()}

/* ============ SOUND (recorded voice first, then device voice) ============ */
const hasV=l=>{try{return speechSynthesis.getVoices().some(v=>v.lang.toLowerCase().startsWith(l))}catch(e){return false}};
function tts(x,l){try{if(l=="bn"&&!hasV("bn"))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang=l=="en"?"en-US":"bn-BD";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function clip(k){if(au){au.pause();au=null}if(REC[k]){au=new Audio(REC[k]);au.play().catch(()=>{});return true}return false}
function say(x){if(clip(x.k))return;tts(x.kind=="N"?x.word:x.lang=="en"?`${x.ch}. ${x.ch} for ${x.word}`:`${x.ch}. ${x.word}`,x.lang)}
function sayP(id){const p=PH.find(q=>q[0]==id);if(!clip(lang+":p_"+id))tts(p[lang=="en"?1:2],lang)}
const canSay=x=>!!REC[x.k]||x.lang=="en"||hasV("bn");
function beep(f,d=.15){try{const c=beep.c||(beep.c=new(window.AudioContext||webkitAudioContext)),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function praise(){const p=R(PH.slice(0,2));mas(p[lang=="en"?1:2]);sayP(p[0]);beep(800);setTimeout(()=>beep(1000),150)}

/* ============ SAVED VOICES ============ */
const db=new Promise(r=>{try{const q=indexedDB.open("letterfun",1);q.onupgradeneeded=()=>q.result.createObjectStore("a");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const put=(k,b)=>db.then(d=>d&&new Promise(r=>{const t=d.transaction("a","readwrite");t.objectStore("a").put(b,k);t.oncomplete=r}));
const loadLocal=()=>db.then(d=>d&&new Promise(r=>{const q=d.transaction("a").objectStore("a").openCursor();q.onsuccess=e=>{const c=e.target.result;if(c){BL[c.key]=c.value;REC[c.key]=URL.createObjectURL(c.value);c.continue()}else r()}}));
async function addVoices(o,sv){for(const k in o){const b=await (await fetch(o[k])).blob();BL[k]=b;REC[k]=URL.createObjectURL(b);if(sv)await put(k,b)}}
const loadFile=()=>fetch("voices.json").then(r=>r.ok?r.json():{}).then(o=>addVoices(o,false)).catch(()=>{});
async function exportV(){const o={};for(const k in BL)o[k]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(BL[k])});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));a.download="voices.json";a.click()}
async function importV(f){if(!f)return;try{await addVoices(JSON.parse(await f.text()),true);toast("Voices loaded ✅");parent()}catch(e){toast("Could not read that file")}}

/* ============ HOME ============ */
function homeScreen(){
 const nx=nextLesson(),w=h("div","center");
 w.innerHTML=`<div class=row><button class="b ${lang=="en"?"sel":""}" id=le>ABC</button><button class="b ${lang=="bn"?"sel":""}" id=lb>অ আ ক</button></div><div class=hero>🦜</div><h2 style="margin:4px">${tx("hi")}${P.name?" "+P.name:""}!</h2>`;
 if(nx)w.append(h("button","cont",`▶️ ${tx("next")}: ${nx.name}`,()=>go(()=>lessonPlay(nx))));
 const g=h("div","menu");
 [["🔤","letters","mb1",()=>go(()=>lessonList("L"))],["🔢","numbers","mb2",()=>go(()=>lessonList("N"))],["🎮","games","mb3",()=>go(gamesMenu)],["✏️","trace","mb4",()=>go(traceMenu)],["🏆","rewards","mb5",()=>go(rewards)]]
  .forEach(m=>g.append(h("button","mbtn "+m[2],`<span>${m[0]}</span>${tx(m[1])}`,m[3])));
 w.append(g,h("div","row",`<button class=b id=pg style="font-size:18px;opacity:.55">⚙️ Parents (hold)</button>`));
 scr(w);
 $("le").onclick=()=>{lang="en";beep(600);homeScreen()};$("lb").onclick=()=>{lang="bn";beep(600);homeScreen()};
 $("pg").onpointerdown=()=>{pgT=setTimeout(()=>go(parent),1500)};$("pg").onpointerup=$("pg").onpointerleave=()=>clearTimeout(pgT);
 if(!greeted){greeted=true;later(hello,500)}}

/* ============ LESSONS ============ */
function lessonList(kind){
 const ls=lessons(kind),nx=ls.find(l=>!P.done[l.id]),box=h("div","list");
 ls.forEach(l=>box.append(h("button","lcrd"+(l===nx?" nxt":""),`<span class=chips>${l.items.map(x=>`<i class="chip m${P.m[x.k]||0}">${disp(x)}</i>`).join("")}</span><span>${P.done[l.id]?"✅":l===nx?"▶️":"⭐"} ${l.name}</span>`,()=>go(()=>lessonPlay(l)))));
 scr(box)}
function lessonPlay(l){
 P.st[l.id]=1;save();let i=0;
 const draw=()=>{const x=l.items[i];
  const pic=x.kind=="N"?`<div class=objs>${Array(x.n).fill(x.pic).join("")}</div>`:`<div class=pic>${x.pic}</div>`;
  const line=x.kind=="N"?`${x.ch} – ${x.word}`:(x.lang=="en"?`${x.ch} for ${x.word}`:`${x.ch} – ${x.word}`);
  $("app").innerHTML=`<div class=bar><b>${l.name}</b><span>${l.items.map((_,j)=>`<i class="dot${j<=i?" on":""}"></i>`).join("")}</span></div>
  <div class=lcard><div class=bigL id=bl style="color:${COL[i%6]}">${disp(x)}</div>${pic}<div class=w>${line}</div></div>
  <div class=row><button class=btn id=pv>⬅️</button><button class="btn big" id=sp>🔊</button><button class="btn go" id=nx>${i==l.items.length-1?"🎯":"➡️"}</button></div>`;
  RP=()=>say(x);$("bl").onclick=$("sp").onclick=RP;$("app").querySelector(".pic,.objs").onclick=RP;
  $("pv").onclick=()=>{if(i>0){i--;draw()}};
  $("nx").onclick=()=>{if(i<l.items.length-1){i++;draw()}else quiz(l)};
  later(RP,250)};
 draw()}
function quiz(l){
 session({title:"🎯 "+l.name,mk:()=>sh(l.items),round:(t,S,st)=>t.kind=="N"?countR(t,S,st):matchR(t,S,st,l.items),
  onEnd:()=>{if(!P.done[l.id]){P.done[l.id]=1;addStar(3);save()}}})}

/* ============ GAMES ============ */
function pool(kind){const ls=lessons(kind);if(P.all)return ls.flatMap(l=>l.items);let out=[];
 ls.forEach(l=>{if(P.st[l.id]||P.done[l.id])out=out.concat(l.items)});
 for(const l of ls){if(out.length>=6)break;if(!out.some(x=>l.items.includes(x)))out=out.concat(l.items)}return out}
function gpool(kind){let p=pool(kind).filter(x=>!x.skip);if(p.length<4)p=allItems(kind).filter(x=>!x.skip).slice(0,8);return p}
function pickMany(p,n){let rest=[],out=[];while(out.length<n){if(!rest.length)rest=p.slice();const w=rest.map(x=>4-(P.m[x.k]||0));let r=Math.random()*w.reduce((a,b)=>a+b,0),j=0;for(;j<rest.length-1;j++){r-=w[j];if(r<=0)break}out.push(rest[j]);rest.splice(j,1)}return out}
function opts3(t,pl){const ok=x=>x!==t&&(t.kind=="N"||!x.skip);let d=sh(pl.filter(ok)).slice(0,2);
 if(d.length<2)d=d.concat(sh(allItems(t.kind).filter(x=>ok(x)&&!d.includes(x)))).slice(0,2);return sh([t,...d])}
function gamesMenu(){const g=h("div","menu");
 [["🧩","g_match","mb1","match"],["🎈","g_pop","mb2","pop"],["👂","g_listen","mb3","listen"],["🍎","g_count","mb4","count"],["🃏","g_mem","mb5","mem"]]
 .forEach(x=>g.append(h("button","mbtn "+x[2],`<span>${x[0]}</span>${tx(x[1])}`,()=>go(()=>play(x[3])))));scr(g)}
function play(id){
 const L5=()=>pickMany(gpool("L"),5);
 if(id=="match")return session({title:"🧩 "+tx("g_match"),mk:L5,round:(t,S,st)=>matchR(t,S,st,gpool("L"))});
 if(id=="pop")return session({title:"🎈 "+tx("g_pop"),mk:L5,round:popR});
 if(id=="count")return session({title:"🍎 "+tx("g_count"),mk:()=>pickMany(gpool("N"),5),round:countR});
 if(id=="mem")return session({title:"🃏 "+tx("g_mem"),mk:()=>[null],round:memR});
 if(id=="listen"){const p=gpool("L").filter(canSay);if(!p.length){scr(h("div","center",`<div class=hero>🔇</div><h2>${tx("novoice")}</h2>`));return}
  return session({title:"👂 "+tx("g_listen"),mk:()=>pickMany(p,5),round:listenR})}}

/* one session = a few rounds, then a celebration */
function session(o){
 let i=0,good=0,T=o.mk();const N=T.length;
 $("app").innerHTML=`<div class=bar><b>${o.title}</b><span id=dots></span></div><div id=stage class=stage></div><div class=row><button class=btn id=rp>🔊</button></div>`;
 $("rp").onclick=()=>RP();
 const step=()=>{
  $("dots").innerHTML=Array.from({length:N},(_,j)=>`<i class="dot${j<i?" on":""}"></i>`).join("");
  if(i>=N)return finish();
  const S={m:0,
   ok(it){if(!S.m){if(it)mark(it,true);addStar();good++}clearInterval(iv);later(praise,900);later(()=>{i++;step()},2300)},
   bad(it){if(!S.m){S.m=1;if(it)mark(it,false)}beep(220,.25);mas(PH[2][lang=="en"?1:2]);sayP("again")}};
  const st=$("stage");st.className="stage";st.innerHTML="";RP=()=>{};
  o.round(T[i],S,st)};
 const finish=()=>{if(o.onEnd)o.onEnd(good,N);
  $("app").innerHTML=`<div class=center><div class=hero>🦜</div><h2>${tx("well")}${P.name?" "+P.name:""}! 🎉</h2><div class=pic style="font-size:48px">${"⭐".repeat(Math.min(good,10))}</div><p style="font-size:28px">${good}/${N}</p><div class=row><button class="btn go" id=ag>🔁 ${tx("again")}</button><button class=btn id=hm>🏠</button></div></div>`;
  confetti();later(()=>sayP("done"),400);$("ag").onclick=()=>session(o);$("hm").onclick=goHome};
 step()}
function mkOpts(st,list,t,S){const d=h("div","opts");
 list.forEach((o,i)=>{const b=h("button","opt",disp(o));b.style.background=COL[i%6];
  b.onclick=()=>{if(o===t){b.classList.add("good");say(t);S.ok(t)}else{b.classList.add("shake");b.style.opacity=.35;b.disabled=true;S.bad(t)}};d.append(b)});st.append(d)}
function matchR(t,S,st,pl){
 st.innerHTML=`<div class=q>${tx(t.skip?"q_find":"q_start")}</div>`+(t.skip?`<div class=bigL>${t.ch}</div>`:`<div class=pic>${t.pic}</div><div class=w>${t.word}</div>`);
 RP=()=>say(t);say(t);mkOpts(st,opts3(t,pl||gpool("L")),t,S)}
function countR(t,S,st){
 st.innerHTML=`<div class=q>${tx("q_count")}</div><div class=objs>${Array(t.n).fill(t.pic).join("")}</div>`;RP=()=>say(t);
 const d=sh(allItems("N").filter(x=>x!==t&&Math.abs(x.n-t.n)<=3)).slice(0,2);mkOpts(st,sh([t,...d]),t,S)}
function listenR(t,S,st){
 st.innerHTML=`<div class=q>${tx("q_listen")}</div><button class="btn big" id=lb2>🔊</button>`;RP=()=>say(t);$("lb2").onclick=RP;later(RP,300);
 mkOpts(st,opts3(t,gpool("L")),t,S)}
function popR(t,S,st){
 st.classList.add("pop");st.innerHTML=`<div class=q>🎈 <b style="font-size:60px;color:#e0457b">${t.ch}</b></div>`;RP=()=>say(t);say(t);
 const p=gpool("L");let done=false;
 iv=setInterval(()=>{if(done)return;const x=Math.random()<.4?t:R(p),b=h("button","bal",x.ch);
  b.style.left=Math.random()*Math.max(60,st.clientWidth-100)+"px";b.style.background=COL[Math.random()*6|0];b.style.animationDuration=(6+Math.random()*3)+"s";
  b.onpointerdown=()=>{if(done)return;if(x===t){done=true;b.textContent="💥";say(t);S.ok(t);later(()=>st.querySelectorAll(".bal").forEach(e=>e.remove()),700)}else{b.classList.add("shake");S.bad(t)}};
  b.onanimationend=()=>b.remove();st.append(b)},900)}
function memR(_,S,st){
 const T=pickMany(gpool("L"),3);let open=[],lock=false,matched=0;
 const cards=sh(T.flatMap(x=>[{x,t:"c"},{x,t:"p"}]));
 st.innerHTML=`<div class=q>${tx("q_mem")}</div>`;const g=h("div","mem");
 cards.forEach(c=>{const b=h("button","mc","❓");c.b=b;
  b.onclick=()=>{if(lock||c.f||c.d)return;c.f=1;b.innerHTML=c.t=="c"?disp(c.x):c.x.pic;b.classList.add("up");say(c.x);open.push(c);
   if(open.length==2){lock=true;const[a,z]=open;
    if(a.x===z.x&&a.t!=z.t){a.d=z.d=1;a.b.classList.add("ok");z.b.classList.add("ok");open=[];lock=false;matched++;mark(a.x,true);addStar();beep(900);if(matched==3)later(()=>S.ok(null),700)}
    else later(()=>{[a,z].forEach(q=>{q.f=0;q.b.innerHTML="❓";q.b.classList.remove("up")});open=[];lock=false},1000)}};
  g.append(b)});st.append(g);RP=()=>{}}

/* ============ TRACE (checks the child really traced) ============ */
function traceMenu(){const w=h("div","grid");
 ["L","N"].forEach(k=>lessons(k).forEach(l=>{w.append(h("div","hd",l.name));l.items.forEach((x,i)=>{const b=h("button","tile",disp(x),()=>traceOne(x,i));b.style.background=COL[i%6];w.append(b)})}));scr(w)}
function traceOne(x,ci){
 const s=Math.max(240,Math.min(innerWidth-50,innerHeight-200,520))|0,col=COL[ci%6],d=h("div","card");
 d.innerHTML=`<div class=cin><div style="position:relative;width:${s}px;height:${s}px;margin:0 auto;background:#fff;outline:4px dashed #CBE8FF;border-radius:16px"><canvas id=g1 width=${s} height=${s} style="position:absolute;left:0;top:0"></canvas><canvas id=g2 width=${s} height=${s} style="position:absolute;left:0;top:0;touch-action:none"></canvas></div>
 <div class=row><button class=btn id=ts>🔊</button><button class=btn id=tc>🗑</button><button class="btn go" id=tk>✅</button><button class=btn id=tq>✖</button></div></div>`;
 document.body.append(d);
 const g=$("g1").getContext("2d");g.font=`bold ${s*.72}px "Noto Sans Bengali",system-ui,sans-serif`;g.textAlign="center";g.textBaseline="middle";g.fillStyle=g.strokeStyle="#d9d9d9";g.lineWidth=s/30;g.fillText(x.ch,s/2,s*.54);g.strokeText(x.ch,s/2,s*.54);
 const c=$("g2"),q=c.getContext("2d");q.strokeStyle=col;q.lineWidth=s/13;q.lineCap=q.lineJoin="round";
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*s/r.width,(e.clientY-r.top)*s/r.height]};let dr=false;
 c.onpointerdown=e=>{dr=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);q.beginPath();q.moveTo(a,b);q.lineTo(a+.1,b);q.stroke()};
 c.onpointermove=e=>{if(!dr)return;const[a,b]=pt(e);q.lineTo(a,b);q.stroke()};c.onpointerup=()=>dr=false;
 $("ts").onclick=()=>say(x);$("tc").onclick=()=>q.clearRect(0,0,s,s);$("tq").onclick=()=>d.remove();say(x);
 $("tk").onclick=()=>{const A=g.getImageData(0,0,s,s).data,B=q.getImageData(0,0,s,s).data;let tot=0,cov=0,ink=0;
  for(let i=3;i<A.length;i+=16){const G=A[i]>40,I=B[i]>40;if(G){tot++;if(I)cov++}if(I)ink++}
  if(tot&&cov/tot>.4&&ink<tot*3.2){if(!P.tr[x.k]){P.tr[x.k]=1;addStar()}confetti();praise();later(()=>d.remove(),1300)}
  else{mas(PH[2][lang=="en"?1:2]+" ✏️");sayP("again");beep(220,.25)}}}

/* ============ REWARDS ============ */
function rewards(){const e=Math.min(STK.length,P.stars/10|0),dn=Object.keys(P.done).filter(k=>k.startsWith(lang)).length;
 scr(h("div","center",`<h2>🏆 ${tx("rewards")}</h2><div class=pic style="font-size:64px">⭐ ${P.stars}</div><div class=meter><b style="width:${(P.stars%10)*10}%"></b></div><p style="font-size:26px">🔥 ${P.streak} &nbsp; ✅ ${dn}/${LES[lang].length}</p><div class=stk>${STK.map((s,i)=>`<span>${i<e?s:"❓"}</span>`).join("")}</div>`))}

/* ============ PARENTS ============ */
function parent(){
 const c=a=>a.filter(x=>REC[x.k]).length,Li=allItems("L"),Ni=allItems("N"),Pi=phItems(),w=h("div","center");
 w.innerHTML=`<h2>⚙️ Parents</h2><div class=row><button class="b ${lang=="en"?"sel":""}" id=pe>ABC</button><button class="b ${lang=="bn"?"sel":""}" id=pb>অ আ ক</button></div>
 <p style="font-size:20px">Recorded: letters ${c(Li)}/${Li.length} · numbers ${c(Ni)}/${Ni.length} · phrases ${c(Pi)}/${Pi.length}<br>${lang=="bn"?(hasV("bn")?"Bangla voice found on this tablet":"No Bangla voice on this tablet → please record"):"English uses the tablet's voice unless you record"}</p>
 <input id=ld type=file accept=".json" hidden>`;
 const row=h("div","row");
 [["🎙️ Record letters",()=>go(()=>recList("L"))],["🎙️ Record numbers",()=>go(()=>recList("N"))],["💬 Record phrases",()=>go(()=>recList("P"))],["💾 Save voices file",exportV],["📂 Load voices file",()=>$("ld").click()],["📊 Progress",()=>go(pprog)],["🔧 Settings",()=>go(settings)],["⭐ Reset all",()=>{if(confirm("Reset stars and progress?")){P={stars:0,done:{},st:{},m:{},tr:{},name:P.name,all:P.all,streak:1,lastDay:today};save();chrome();toast("Reset")}}]]
 .forEach(x=>row.append(h("button","b",x[0],x[1])));w.append(row);scr(w);
 $("pe").onclick=()=>{lang="en";parent()};$("pb").onclick=()=>{lang="bn";parent()};$("ld").onchange=e=>importV(e.target.files[0])}
function recList(kind){
 const items=kind=="L"?allItems("L"):kind=="N"?allItems("N"):phItems(),w=h("div","grid");let last="";
 w.append(h("div","hd","Tap one → ⏺ → say it → ⏹ . ✓ = recorded"));
 items.forEach((x,i)=>{
  if(kind!="P"){const l=lessons(kind).find(z=>z.items.includes(x));if(l.name!=last){last=l.name;w.append(h("div","hd",l.name))}}
  const b=h("button",kind=="P"?"b":"tile",(kind=="P"?x.ch+(REC[x.k]?" ✓":""):disp(x)+(REC[x.k]?"<i>✓</i>":"")),()=>recOne(items,kind,i));
  if(kind!="P")b.style.background=COL[i%6];w.append(b)});scr(w)}
function recOne(items,kind,i){
 const x=items[i];rk=x.k;document.querySelectorAll(".card").forEach(c=>c.remove());
 const d=h("div","card");
 d.innerHTML=`<div class=cin><div class=bigL style="font-size:80px">${x.kind=="P"?"💬":disp(x)}</div><div style="font-size:28px">${x.kind=="N"?"":x.pic} ${x.word}</div>
 <p style="font-size:24px">Say: “${x.kind=="L"?x.ch+", "+x.word:x.word}”</p>
 <div class=row><button class="btn big" id=rb>⏺</button><button class=btn id=rpl>▶️</button><button class=btn id=rnx>⏭️</button><button class=btn id=rcl>✖</button></div><p id=msg style="font-size:22px"></p></div>`;
 document.body.append(d);
 $("rb").onclick=toggleRec;$("rpl").onclick=()=>clip(rk);
 $("rnx").onclick=()=>{let j=items.findIndex((z,n)=>n>i&&!REC[z.k]);if(j<0)j=(i+1)%items.length;recOne(items,kind,j)};
 $("rcl").onclick=()=>{d.remove();recList(kind)}}
async function toggleRec(){
 if(mr&&mr.state=="recording"){mr.stop();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true}),k=rk;mr=new MediaRecorder(s);chunks=[];
  mr.ondataavailable=e=>chunks.push(e.data);
  mr.onstop=async()=>{s.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:mr.mimeType});BL[k]=b;REC[k]=URL.createObjectURL(b);await put(k,b);if($("msg"))$("msg").textContent="✅ Saved";if($("rb"))$("rb").textContent="⏺"};
  mr.start();$("rb").textContent="⏹";$("msg").textContent="🔴 Recording...";later(()=>{if(mr&&mr.state=="recording")mr.stop()},6000)}
 catch(e){if($("msg"))$("msg").textContent="Mic blocked: open from the https link and allow the microphone."}}
function pprog(){const w=h("div","center","<h2>📊 Progress</h2><p>⬜ new · 🟨 practising · 🟩 known</p>");
 [...lessons("L"),...lessons("N")].forEach(l=>{w.append(h("div","hd",l.name+(P.done[l.id]?" ✅":"")));const r=h("div","chips");r.style.justifyContent="center";l.items.forEach(x=>r.append(h("i","chip m"+(P.m[x.k]||0),disp(x))));w.append(r)});scr(w)}
function settings(){scr(h("div","center",`<h2>🔧 Settings</h2><p>Child's name<br><input id=nm style="font-size:28px;padding:8px;border-radius:12px;border:3px solid #CBE8FF"></p><p style="font-size:20px"><label><input type=checkbox id=al ${P.all?"checked":""}> Games use all letters and numbers (not only the learned ones)</label></p>`));
 $("nm").value=P.name;$("nm").oninput=e=>{P.name=e.target.value;save()};$("al").onchange=e=>{P.all=e.target.checked;save()}}

/* ============ START ============ */
try{speechSynthesis.getVoices()}catch(e){}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
loadFile().then(loadLocal).then(goHome);
</script></body></html>
